    <!-- Google tag, Microsoft Clarity, Meta Pixel: each library's own stub
         (dataLayer/gtag, the clarity queue function, fbq's queue) is defined
         right away, so a call made anywhere in the app before the real
         script arrives is queued, not lost. Only the network fetch of each
         library's actual script — the expensive part — is pushed to just
         after the page has loaded, so analytics stops competing with the
         page's own content for the main thread during first paint. Nothing
         about what gets tracked, or when events fire relative to the user,
         changes. -->

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VQ2JM04HQC');

          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      })(window, document, "clarity", "script", "yn6bws8qhd");

      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};

      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1737034017590347');

      function loadThirdPartyScripts() {
        var gtagScript = document.createElement('script');

        gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-VQ2JM04HQC';

        var fbScript = document.createElement('script');
        fbScript.async = true;
        fbScript.src = 'https://connect.facebook.net/en_US/fbevents.js';
        document.head.appendChild(fbScript);
      }

      if (document.readyState === 'complete') {
        loadThirdPartyScripts();
      } else {
        window.addEventListener('load', loadThirdPartyScripts);
      }
    </script>
